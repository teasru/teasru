<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;family=DM+Mono:wght@400;500&amp;display=swap');

      .name { font-family: 'Syne', 'Arial Black', sans-serif; font-weight: 800; font-size: 64px; fill: #ffffff; letter-spacing: -2px; }
      .name-ghost { font-family: 'Syne', 'Arial Black', sans-serif; font-weight: 800; font-size: 64px; fill: none; stroke: #ff2d78; stroke-width: 1; letter-spacing: -2px; opacity: 0.25; }
      .sub  { font-family: 'DM Mono', 'Courier New', monospace; font-size: 13px; fill: #7c6fa0; letter-spacing: 2px; }
      .tag  { font-family: 'DM Mono', 'Courier New', monospace; font-size: 11px; }
      .dot  { animation: pulse 2s ease-in-out infinite; }
      .star { animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
      .star2 { animation: spin 4s linear infinite reverse; transform-box: fill-box; transform-origin: center; }
      .float1 { animation: floatY 3s ease-in-out infinite; }
      .float2 { animation: floatY 3.5s ease-in-out infinite 0.5s; }
      .float3 { animation: floatY 4s ease-in-out infinite 1s; }
      .float4 { animation: floatY 2.8s ease-in-out infinite 1.5s; }
      .float5 { animation: floatY 3.2s ease-in-out infinite 0.3s; }
      .blink { animation: blink 1.1s step-end infinite; }
      .shimmer { animation: shimmer 6s ease-in-out infinite; }
      .scan { animation: scan 3s ease-in-out infinite; }

      @keyframes pulse {
        0%,100% { opacity: 1; r: 3; }
        50% { opacity: 0.4; r: 2; }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes floatY {
        0%,100% { transform: translateY(0px); }
        50%      { transform: translateY(-7px); }
      }
      @keyframes blink {
        0%,100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes shimmer {
        0%   { transform: translateX(-120px); opacity: 0; }
        20%  { opacity: 0.6; }
        80%  { opacity: 0.6; }
        100% { transform: translateX(700px); opacity: 0; }
      }
      @keyframes scan {
        0%   { transform: translateY(0px); opacity: 0.5; }
        50%  { transform: translateY(180px); opacity: 0.5; }
        100% { transform: translateY(0px); opacity: 0; }
      }
    </style>

    <pattern id="halftone" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#ff2d78" opacity="0.12"/>
    </pattern>

    <clipPath id="nameClip">
      <rect x="40" y="60" width="580" height="100"/>
    </clipPath>
  </defs>

  <rect width="900" height="280" fill="#0d0a14" rx="12"/>
  <rect width="900" height="280" fill="url(#halftone)" rx="12"/>
  <rect x="0" y="0" width="300" height="280" fill="#1a1424" opacity="0.4" rx="12"/>
  <rect x="600" y="0" width="300" height="280" fill="#1a1424" opacity="0.4"/>
  <rect x="588" y="0" width="1" height="280" fill="#3d2f5e" opacity="0.6"/>
  <rect x="301" y="0" width="1" height="280" fill="#3d2f5e" opacity="0.3"/>
  <rect class="scan" x="0" y="0" width="900" height="2" fill="#ff2d78" opacity="0.08" rx="1"/>

  <g class="star" style="transform-origin:150px 140px">
    <polygon points="150,80 160,125 205,125 170,150 183,195 150,170 117,195 130,150 95,125 140,125" fill="none" stroke="#ff2d78" stroke-width="0.8" opacity="0.15"/>
  </g>
  <g class="star2" style="transform-origin:150px 140px">
    <polygon points="150,90 157,120 187,120 163,138 172,168 150,152 128,168 137,138 113,120 143,120" fill="none" stroke="#b8ff00" stroke-width="0.6" opacity="0.12"/>
  </g>

  <g class="float1" style="transform-origin:110px 105px">
    <circle cx="110" cy="105" r="22" fill="#1a1424" stroke="#ff2d78" stroke-width="1.5"/>
    <polygon points="92,88 98,75 104,88" fill="#ff2d78" opacity="0.8"/>
    <polygon points="116,88 122,75 128,88" fill="#ff2d78" opacity="0.8"/>
    <polygon points="94,88 98,79 102,88" fill="#ffd6e7" opacity="0.6"/>
    <polygon points="118,88 122,79 126,88" fill="#ffd6e7" opacity="0.6"/>
    <ellipse cx="103" cy="103" rx="4" ry="5" fill="#0d0a14"/>
    <ellipse cx="117" cy="103" rx="4" ry="5" fill="#0d0a14"/>
    <circle cx="104" cy="102" r="1.5" fill="white"/>
    <circle cx="118" cy="102" r="1.5" fill="white"/>
    <ellipse cx="98" cy="110" rx="5" ry="3" fill="#ff2d78" opacity="0.4"/>
    <ellipse cx="122" cy="110" rx="5" ry="3" fill="#ff2d78" opacity="0.4"/>
    <circle cx="110" cy="108" r="2" fill="#ff2d78" opacity="0.7"/>
    <path d="M106,111 Q110,115 114,111" stroke="#ff2d78" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <line x1="88" y1="107" x2="103" y2="109" stroke="#d4bfff" stroke-width="0.8" opacity="0.6"/>
    <line x1="88" y1="112" x2="103" y2="111" stroke="#d4bfff" stroke-width="0.8" opacity="0.6"/>
    <line x1="117" y1="109" x2="132" y2="107" stroke="#d4bfff" stroke-width="0.8" opacity="0.6"/>
    <line x1="117" y1="111" x2="132" y2="112" stroke="#d4bfff" stroke-width="0.8" opacity="0.6"/>
  </g>

  <g class="float2" style="transform-origin:195px 175px">
    <rect x="188" y="175" width="14" height="18" rx="3" fill="#fff4e6" opacity="0.85"/>
    <ellipse cx="195" cy="176" rx="20" ry="13" fill="#ff2d78"/>
    <circle cx="188" cy="172" r="3.5" fill="white" opacity="0.8"/>
    <circle cx="200" cy="169" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="194" cy="177" r="2" fill="white" opacity="0.8"/>
    <ellipse cx="191" cy="180" rx="1.8" ry="2.2" fill="#0d0a14"/>
    <ellipse cx="199" cy="180" rx="1.8" ry="2.2" fill="#0d0a14"/>
    <path d="M189,184 Q195,188 201,184" stroke="#0d0a14" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>

  <g class="float3" style="transform-origin:65px 170px">
    <text x="60" y="175" font-size="18" fill="#b8ff00" opacity="0.7">✦</text>
  </g>
  <g class="float4" style="transform-origin:230px 85px">
    <text x="225" y="90" font-size="14" fill="#c084fc" opacity="0.6">✧</text>
  </g>
  <g class="float5" style="transform-origin:55px 85px">
    <text x="50" y="90" font-size="11" fill="#ff2d78" opacity="0.5">♡</text>
  </g>
  <g class="float2" style="transform-origin:240px 195px">
    <text x="235" y="200" font-size="10" fill="#7dd3fc" opacity="0.5">✿</text>
  </g>

  <circle class="dot" cx="72" cy="145" r="3" fill="#ff2d78" opacity="0.6" style="animation-delay:0s"/>
  <circle class="dot" cx="82" cy="148" r="2" fill="#b8ff00" opacity="0.5" style="animation-delay:0.4s"/>
  <circle class="dot" cx="66" cy="153" r="2.5" fill="#c084fc" opacity="0.55" style="animation-delay:0.8s"/>
  <circle class="dot" cx="230" cy="130" r="2.5" fill="#ff2d78" opacity="0.4" style="animation-delay:0.3s"/>
  <circle class="dot" cx="240" cy="140" r="2" fill="#b8ff00" opacity="0.4" style="animation-delay:0.7s"/>

  <!-- ghost offset -->
  <text class="name-ghost" x="313" y="148" transform="translate(5,5)" clip-path="url(#nameClip)">Sruthi ♡</text>

  <!-- main name -->
  <text class="name" x="310" y="143">Sruthi <tspan fill="#ff2d78">♡</tspan></text>

  <!-- shimmer -->
  <rect class="shimmer" x="0" y="75" width="80" height="80" fill="white" opacity="0.04" transform="skewX(-20)" clip-path="url(#nameClip)"/>

  <!-- cursor -->
  <rect class="blink" x="570" y="88" width="4" height="48" fill="#ff2d78" rx="1"/>

  <text class="sub" x="313" y="168">Bala Gayatri Sruthi Manikonda</text>

  <line x1="313" y1="178" x2="580" y2="178" stroke="#3d2f5e" stroke-width="1"/>
  <circle cx="313" cy="178" r="2" fill="#ff2d78"/>
  <circle cx="580" cy="178" r="2" fill="#b8ff00"/>

  <rect x="313" y="190" width="128" height="22" rx="2" fill="#1a1424" stroke="#ff2d78" stroke-width="1"/>
  <text class="tag" x="321" y="205" fill="#ff2d78">BITS Pilani · 2027</text>

  <rect x="449" y="190" width="110" height="22" rx="2" fill="#1a1424" stroke="#b8ff00" stroke-width="1"/>
  <text class="tag" x="457" y="205" fill="#b8ff00">systems &amp; backend</text>

  <rect x="313" y="219" width="66" height="22" rx="2" fill="#1a1424" stroke="#c084fc" stroke-width="1"/>
  <text class="tag" x="321" y="234" fill="#c084fc">FOSS ♡</text>

  <rect x="387" y="219" width="116" height="22" rx="2" fill="#ff2d78" stroke="#ff2d78" stroke-width="1"/>
  <text class="tag" x="395" y="234" fill="white">open to work ✦</text>

  <text class="sub" x="620" y="75" fill="#3d2f5e">> links.txt</text>

  <rect x="620" y="85" width="240" height="30" rx="3" fill="#1a1424" stroke="#3d2f5e" stroke-width="1"/>
  <text font-family="'DM Mono','Courier New',monospace" font-size="12" x="636" y="104" fill="#7c6fa0">github</text>
  <text font-family="'DM Mono','Courier New',monospace" font-size="12" x="690" y="104" fill="#d4bfff">/teasru</text>
  <circle cx="629" cy="100" r="4" fill="#ff2d78" opacity="0.7"/>

  <rect x="620" y="122" width="240" height="30" rx="3" fill="#1a1424" stroke="#3d2f5e" stroke-width="1"/>
  <text font-family="'DM Mono','Courier New',monospace" font-size="12" x="636" y="141" fill="#7c6fa0">email</text>
  <text font-family="'DM Mono','Courier New',monospace" font-size="11" x="680" y="141" fill="#d4bfff">recothecoco@</text>
  <circle cx="629" cy="137" r="4" fill="#b8ff00" opacity="0.7"/>

  <rect x="620" y="159" width="240" height="30" rx="3" fill="#1a1424" stroke="#3d2f5e" stroke-width="1"/>
  <text font-family="'DM Mono','Courier New',monospace" font-size="12" x="636" y="178" fill="#7c6fa0">location</text>
  <text font-family="'DM Mono','Courier New',monospace" font-size="12" x="700" y="178" fill="#d4bfff">Hyderabad 🌸</text>
  <circle cx="629" cy="174" r="4" fill="#c084fc" opacity="0.7"/>

  <g class="float1" style="transform-origin:835px 215px">
    <ellipse cx="835" cy="225" rx="22" ry="18" fill="#1a1424" stroke="#b8ff00" stroke-width="1.5"/>
    <circle cx="824" cy="210" r="8" fill="#1a1424" stroke="#b8ff00" stroke-width="1.5"/>
    <circle cx="846" cy="210" r="8" fill="#1a1424" stroke="#b8ff00" stroke-width="1.5"/>
    <ellipse cx="824" cy="211" rx="4" ry="5" fill="#0d0a14"/>
    <ellipse cx="846" cy="211" rx="4" ry="5" fill="#0d0a14"/>
    <circle cx="825" cy="209" r="1.5" fill="white"/>
    <circle cx="847" cy="209" r="1.5" fill="white"/>
    <ellipse cx="819" cy="218" rx="4" ry="2.5" fill="#ff2d78" opacity="0.4"/>
    <ellipse cx="851" cy="218" rx="4" ry="2.5" fill="#ff2d78" opacity="0.4"/>
    <path d="M828,228 Q835,234 842,228" stroke="#b8ff00" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <text x="860" y="205" font-size="10" fill="#ff2d78" opacity="0.7">♡</text>
    <text x="800" y="200" font-size="8" fill="#ff2d78" opacity="0.5">♡</text>
  </g>

  <rect x="0" y="262" width="900" height="18" fill="#1a1424" rx="0"/>
  <rect x="0" y="262" width="900" height="1" fill="#3d2f5e"/>
  <text font-family="'DM Mono','Courier New',monospace" font-size="9" x="20" y="274" fill="#3d2f5e">✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦ · ✦</text>
</svg>
